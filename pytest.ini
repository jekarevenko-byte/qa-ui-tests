[pytest]
testpaths = tests
addopts =
    -v
    --tb=short
    --strict-markers
    --browser chromium
    --screenshot only-on-failure
    --tracing retain-on-failure
    --output test-results
    --alluredir=allure-results
    --clean-alluredir
markers =
    smoke: fast critical-path checks
    regression: full regression suite
    saucedemo: tests of https://www.saucedemo.com
    the_internet: tests of https://the-internet.herokuapp.com
    negative: error-path scenarios
